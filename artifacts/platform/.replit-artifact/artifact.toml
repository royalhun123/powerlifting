kind = "web"
previewPath = "/"
title = "Platform — Powerlifting Coach"
description = "Powerlifting coaching and workout tracking with imported peaking programs, client invitations, set-by-set logging and performance analytics."
version = "1.0.0"
id = "artifacts/platform"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23633

[services.development]
run = "pnpm --filter @workspace/platform run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/platform", "run", "build" ]
serve = "static"
publicDir = "artifacts/platform/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23633"
BASE_PATH = "/"
